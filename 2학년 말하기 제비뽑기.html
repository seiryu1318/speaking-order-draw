<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14234b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="제비뽑기">
  <title>제비뽑기</title>
  <script>
    // The original installed app opens this page without a version parameter.
    const manifestLink=document.createElement('link');
    manifestLink.rel='manifest';
    manifestLink.href=new URLSearchParams(location.search).has('v')
      ? 'manifest.webmanifest?v=18'
      : 'manifest-legacy.webmanifest?v=18';
    document.head.append(manifestLink);
  </script>
  <link rel="icon" sizes="192x192" href="icon-192.png?v=15">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=15">
  <style>
    :root { --ink:#14234b; --navy:#14234b; --blue:#24386c; --line:#c7cfdf; --paper:#fff; --soft:#eef1f7; --shade:#f7f8fb; --muted:#5c6680; --danger:#344263; }
    * { box-sizing:border-box; }
    body { margin:0; background:#eef1f6; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; font-size:18px; }
    button, input { font:inherit; }
    button { touch-action:manipulation; }
    button:focus-visible, input:focus-visible { outline:3px solid var(--blue); outline-offset:3px; box-shadow:0 0 0 5px #fff; }
    input { color:var(--ink); accent-color:var(--navy); }
    .app { width:min(1180px,100%); min-height:100vh; min-height:100dvh; margin:0 auto; background:var(--paper); box-shadow:0 0 36px rgba(18,32,46,.13); }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:calc(25px + env(safe-area-inset-top)) calc(28px + env(safe-area-inset-right)) 21px calc(28px + env(safe-area-inset-left)); background:var(--navy); color:#fff; }
    h1 { margin:0; font-size:clamp(32px,5vw,48px); letter-spacing:-.05em; }
    .install { border:2px solid #fff; border-radius:10px; background:#fff; color:var(--navy); padding:10px 16px; font-weight:900; white-space:nowrap; cursor:pointer; }
    nav { display:flex; overflow-x:auto; border-bottom:2px solid var(--line); background:#fff; position:sticky; top:0; z-index:10; scrollbar-width:thin; }
    .tab { flex:0 0 auto; min-width:155px; border:0; border-bottom:6px solid transparent; background:#fff; padding:17px 16px 13px; color:var(--muted); font-size:20px; font-weight:900; cursor:pointer; }
    .tab.active { color:var(--navy); background:var(--soft); border-bottom-color:var(--navy); }
    .custom-tab-item { position:relative; display:flex; flex:0 0 auto; align-items:center; background:#fff; }
    .custom-tab-item .tab { padding-right:48px; }
    #sortableTabsNav { display:contents; }
    #sortableTabsNav .tab { cursor:grab; }
    #sortableTabsNav .tab:active { cursor:grabbing; }
    .tab-drag-ghost { opacity:.35; background:var(--soft); }
    .tab-drag-chosen { box-shadow:inset 0 -5px 0 var(--navy); z-index:12; }
    .tab-close { position:absolute; right:10px; top:50%; transform:translateY(-54%); display:grid; place-items:center; width:28px; height:28px; padding:0; border:0; border-radius:50%; background:var(--navy); color:#fff; font-size:20px; line-height:1; font-weight:1000; cursor:pointer; box-shadow:0 2px 0 rgba(20,35,75,.2); }
    .tab-close:hover { background:var(--blue); }
    .tab-close:active { transform:translateY(-48%); box-shadow:none; }
    .add-tab { flex:0 0 auto; border:0; border-left:1px solid var(--line); background:var(--navy); color:#fff; padding:14px 19px; font-size:19px; font-weight:900; cursor:pointer; }
    #addTabBtn { min-width:58px; color:#8fd5ff; font-size:30px; line-height:1; }
    .fixed-direct-tab { color:#fff; }
    .fixed-direct-tab.active { background:var(--blue); color:#fff; box-shadow:inset 0 -6px 0 #fff; border-bottom-color:var(--blue); }
    main { padding:26px max(28px,env(safe-area-inset-right)) calc(52px + env(safe-area-inset-bottom)) max(28px,env(safe-area-inset-left)); }
    .panel { display:none; }
    .panel.active { display:block; }
    .toolbar { display:flex; flex-wrap:wrap; align-items:end; justify-content:flex-end; gap:11px; margin-bottom:20px; }
    .order-box { display:flex; flex-wrap:wrap; gap:10px; margin-inline-end:auto; padding:13px; background:var(--soft); border:1px solid var(--line); border-radius:11px; }
    .order-box label { display:flex; align-items:center; gap:8px; font-size:19px; font-weight:900; }
    .order-box label span { min-width:0; overflow-wrap:anywhere; }
    .order-box input { width:66px; border:2px solid var(--line); border-radius:6px; padding:9px; text-align:center; background:#fff; font-size:20px; font-weight:900; }
    .btn { border:1px solid transparent; border-radius:6px; background:var(--navy); color:#fff; padding:12px 17px; font-size:18px; font-weight:900; cursor:pointer; box-shadow:0 3px 0 rgba(20,35,75,.15); transition:background-color .18s,box-shadow .18s; }
    .btn:hover:not(:disabled) { background:var(--blue); }
    .btn:active { transform:translateY(2px); box-shadow:none; }
    .btn.secondary { background:var(--blue); }
    .btn.light { background:#fff; color:var(--navy); border:1px solid #8c99b5; box-shadow:0 2px 0 var(--line); }
    .btn.light:hover:not(:disabled) { background:var(--soft); }
    .btn.danger { background:var(--danger); }
    .class-card { margin:0 0 28px; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#fff; }
    .class-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px; background:var(--soft); border-bottom:1px solid var(--line); }
    .class-head h2 { flex:0 0 auto; max-width:min(34%,260px); margin:0; font-size:27px; overflow-wrap:anywhere; }
    .class-name-button {
      display:inline-flex;
      align-items:center;
      gap:9px;
      min-height:44px;
      max-width:100%;
      margin:-4px 0;
      padding:4px 0;
      border:0;
      border-radius:5px;
      background:transparent;
      color:inherit;
      text-align:left;
      overflow-wrap:anywhere;
      cursor:pointer;
    }
    .class-name-button:hover { background:#e0e7f5; }
    .class-edit-icon {
      display:inline-grid;
      flex:0 0 28px;
      place-items:center;
      width:28px;
      height:28px;
      border:1px solid #aab5ca;
      border-radius:5px;
      background:var(--paper);
      color:var(--blue);
    }
    .class-edit-icon svg { width:16px; height:16px; }
    .capture-title { margin:0 0 14px; padding:15px 18px; background:var(--navy); color:#fff; border-radius:6px; font-size:28px; letter-spacing:-.03em; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; min-width:650px; border-collapse:collapse; table-layout:fixed; }
    th, td { padding:14px 12px; border-bottom:1px solid var(--line); text-align:center; }
    th { background:var(--soft); color:var(--navy); font-size:20px; font-weight:900; }
    tbody tr:nth-child(even) td { background:var(--shade); }
    tbody tr:last-child td { border-bottom:0; }
    td { font-size:22px; font-weight:700; }
    td:nth-child(1), th:nth-child(1) { width:12%; }
    td:nth-child(2), th:nth-child(2) { width:24%; }
    td:nth-child(3), th:nth-child(3) { width:40%; }
    td:nth-child(4), th:nth-child(4) { width:24%; }
    td:nth-child(2), td:nth-child(3) { overflow-wrap:anywhere; }
    .row-delete {
      display:inline-grid;
      place-items:center;
      width:min(100%,40px);
      height:40px;
      padding:0;
      border:1px solid #8c99b5;
      border-radius:5px;
      background:var(--paper);
      color:var(--navy);
      cursor:pointer;
    }
    .row-delete svg { width:17px; height:17px; }
    .row-delete:hover { background:var(--soft); border-color:var(--navy); }
    .roster-value {
      display:inline-block;
      min-height:34px;
      max-width:100%;
      padding:3px 2px;
      border:1px solid transparent;
      border-radius:4px;
      background:transparent;
      color:inherit;
      text-align:center;
      line-height:1.2;
      overflow-wrap:anywhere;
      cursor:text;
    }
    .roster-value:hover { background:var(--soft); border-color:var(--line); }
    .row-delete:focus-visible, .roster-value:focus-visible { outline-offset:1px; }
    .roster-footer { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px; padding:12px 16px; border-top:1px solid var(--line); background:var(--shade); }
    td.order-cell, tbody tr:nth-child(even) td.order-cell { background:#e9edf6; border-left:1px solid var(--line); }
    th.order-head { background:var(--navy); color:#fff; letter-spacing:.08em; }
    .name-with-exclude { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; min-width:0; gap:10px; }
    .name-with-exclude > .entry, .name-with-exclude > .roster-value { width:100%; min-width:0; }
    .exclude-label { display:inline-flex; flex:0 0 auto; align-items:center; gap:5px; padding:5px 8px; border:1px solid var(--line); border-radius:5px; background:#fff; color:var(--muted); font-size:15px; font-weight:900; white-space:nowrap; cursor:pointer; }
    .exclude-label input { width:21px; height:21px; margin:0; accent-color:var(--navy); }
    .excluded-row td, tbody tr:nth-child(even).excluded-row td { background:#eef0f4; color:var(--muted); }
    .excluded-row .roster-value,
    .excluded-row .entry { text-decoration:line-through; }
    .excluded-row td.order-cell, tbody tr:nth-child(even).excluded-row td.order-cell { background:#e4e8ef; }
    .rank { display:inline-grid; place-items:center; min-width:64px; height:64px; padding:0 10px; border:2px solid var(--navy); border-radius:5px; background:#fff; color:var(--navy); font-size:32px; line-height:1; font-weight:900; font-variant-numeric:tabular-nums; letter-spacing:-.04em; box-shadow:3px 3px 0 #c5cede; }
    .rank.top { background:var(--navy); color:#fff; border-color:var(--navy); box-shadow:inset 0 0 0 3px var(--navy),inset 0 0 0 4px rgba(255,255,255,.6),3px 3px 0 #bac4d8; }
    .rank.empty { background:#eef0f4; color:var(--muted); border-color:#9da8bc; box-shadow:none; }
    .direct-setup { display:flex; flex-wrap:wrap; align-items:end; gap:11px; margin-bottom:20px; }
    .direct-setup label { display:grid; gap:7px; font-size:19px; font-weight:900; }
    .direct-setup input { width:135px; border:2px solid var(--line); border-radius:6px; padding:10px; font-size:20px; font-weight:800; }
    .direct-actions { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:11px; margin:-8px 0 20px; }
    .save-tab-row { display:flex; justify-content:flex-end; margin:-8px 0 20px; padding:13px; border:1px solid var(--line); border-radius:6px; background:var(--soft); }
    .save-tab-row .btn { min-width:180px; background:var(--navy); }
    .add-rows-btn { background:#e5e9f1; color:var(--muted); border-color:var(--line); transition:background-color .2s ease,transform .2s ease,box-shadow .2s ease; }
    .add-rows-btn:disabled { cursor:default; box-shadow:none; }
    .add-rows-btn.is-ready { background:var(--navy); color:#fff; border-color:var(--navy); animation:addReady .9s ease-in-out infinite alternate; }
    @keyframes addReady { from { transform:translateY(0); box-shadow:0 3px 0 rgba(20,35,75,.16),0 0 0 0 rgba(20,35,75,.16); } to { transform:translateY(-2px); box-shadow:0 5px 0 rgba(20,35,75,.16),0 0 0 6px rgba(20,35,75,.10); } }
    .entry { width:100%; border:1px solid #aab5ca; border-radius:5px; padding:10px 8px; text-align:center; background:#fff; font-size:20px; font-weight:750; }
    .entry:focus { outline:2px solid var(--blue); border-color:var(--blue); }
    dialog { width:min(470px,calc(100% - 30px)); border:0; border-radius:15px; padding:0; box-shadow:0 18px 70px rgba(0,0,0,.35); }
    dialog::backdrop { background:rgba(15,30,45,.55); }
    .dialog-body { padding:24px; }
    .dialog-body h2 { margin:0 0 20px; font-size:28px; }
    .dialog-body label { display:grid; gap:7px; margin:0 0 16px; font-weight:900; }
    .dialog-body input { width:100%; border:2px solid var(--line); border-radius:6px; padding:11px; font-size:20px; }
    .nice-upload-box { margin:0 0 22px; padding:20px 16px; border:1px solid var(--line); border-radius:8px; background:var(--soft); text-align:center; }
    .nice-upload-box h3 { margin:0 0 10px; color:var(--navy); font-size:22px; }
    .nice-path { max-width:33ch; margin:0 auto 16px; color:var(--muted); font-size:15px; font-weight:750; line-height:1.65; word-break:keep-all; }
    .dialog-body .nice-file { position:relative; display:inline-block; margin:0; cursor:pointer; }
    .nice-file input { position:absolute; width:1px; height:1px; margin:-1px; padding:0; border:0; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
    .nice-file .btn { display:inline-block; }
    .nice-file:focus-within .btn { outline:3px solid var(--blue); outline-offset:3px; box-shadow:0 0 0 5px #fff; }
    .nice-status { margin:0; color:var(--navy); font-size:15px; font-weight:850; overflow-wrap:anywhere; }
    .nice-status:not(:empty) { margin-top:12px; }
    .dialog-divider { display:flex; align-items:center; gap:10px; margin:0 0 18px; color:var(--muted); font-size:15px; font-weight:900; }
    .dialog-divider::before, .dialog-divider::after { content:""; flex:1; height:1px; background:var(--line); }
    .type-choice { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:0 0 18px; }
    .type-choice label { display:flex; align-items:center; justify-content:center; gap:9px; margin:0; padding:14px; border:1px solid var(--line); border-radius:6px; background:var(--soft); cursor:pointer; }
    .type-choice input { width:22px; height:22px; margin:0; }
    .split-add { display:flex; flex-wrap:wrap; align-items:end; gap:10px; margin:0 0 20px; padding:14px; border:2px solid var(--line); border-radius:11px; background:var(--soft); }
    .split-add label, .class-head label { display:grid; gap:5px; font-size:17px; font-weight:900; }
    .split-add input, .class-head input { width:105px; border:2px solid var(--line); border-radius:6px; padding:8px; text-align:center; background:#fff; font-size:19px; font-weight:900; }
    .class-actions { display:flex; flex-wrap:wrap; align-items:end; justify-content:flex-end; min-width:0; gap:8px; }
    .class-actions .btn { min-width:0; max-width:100%; overflow-wrap:anywhere; }
    .empty-note { padding:34px 16px; border:1px dashed #9daac4; border-radius:8px; background:var(--shade); text-align:center; font-size:22px; font-weight:900; color:var(--muted); }
    .dialog-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }
    @media (min-width:681px) and (max-width:900px) {
      main { padding:22px 18px 44px; }
      header { padding:22px 20px 18px; }
      .tab { min-width:145px; padding-inline:14px; }
      .class-actions .btn { padding:11px 13px; }
      table { min-width:0; }
      th, td { padding:12px 9px; }
      td { font-size:20px; }
    }
    @media (max-width:680px) {
      body { font-size:17px; }
      header { padding:18px 15px 15px; }
      h1 { font-size:34px; }
      main { padding:18px 11px 38px; }
      .tab { min-width:135px; font-size:18px; padding:15px 12px 11px; }
      .install { padding:9px 12px; }
      .toolbar, .direct-setup, .split-add { align-items:stretch; }
      .class-head { align-items:flex-start; flex-direction:column; padding:11px 12px; }
      .class-head h2 { max-width:100%; font-size:24px; }
      .class-head > .btn { align-self:flex-end; }
      .class-actions { width:100%; }
      .toolbar .btn, .direct-actions .btn, .save-tab-row .btn, .class-actions .btn, .roster-footer .btn { padding:10px 12px; font-size:15px; }
      #room11 > .toolbar, .direct-actions {
        display:grid;
        grid-template-columns:minmax(0,1.2fr) repeat(3,minmax(0,1fr));
        gap:5px;
        align-items:stretch;
      }
      #room11 > .toolbar .btn, .direct-actions .btn {
        min-width:0;
        min-height:44px;
        padding:7px 2px;
        font-size:clamp(11px,3.2vw,15px);
        line-height:1.2;
        letter-spacing:-.03em;
        word-break:keep-all;
        overflow-wrap:anywhere;
      }
      .roster-footer { padding:10px 12px; }
      table { min-width:0; }
      th, td { padding:8px 3px; font-size:16px; }
      td:nth-child(1), th:nth-child(1) { width:15%; }
      td:nth-child(2), th:nth-child(2) { width:24%; }
      td:nth-child(3), th:nth-child(3) { width:42%; }
      td:nth-child(4), th:nth-child(4) { width:19%; }
      .row-delete { width:min(100%,38px); height:38px; }
      .roster-value { padding-inline:1px; }
      .name-with-exclude { gap:4px; }
      .entry { padding:8px 2px; min-width:0; font-size:16px; }
      .exclude-label { min-height:32px; padding:3px 5px; gap:3px; font-size:12px; }
      .exclude-label input { width:16px; height:16px; }
      .rank { min-width:40px; height:40px; padding:0 3px; font-size:clamp(17px,5vw,21px); box-shadow:2px 2px 0 #c5cede; }
      dialog { max-height:92vh; overflow-y:auto; }
    }
    @media (max-width:420px) {
      header { flex-wrap:wrap; padding:calc(15px + env(safe-area-inset-top)) 12px 13px; }
      h1 { font-size:30px; }
      .install { margin-left:auto; font-size:15px; }
      .tab { min-width:122px; font-size:16px; }
      .add-tab { padding-inline:14px; font-size:16px; }
      .dialog-body { padding:18px 15px; }
    }
    @media (prefers-reduced-motion:reduce) { .add-rows-btn.is-ready { animation:none; } button { transition:none!important; } }
    @media print {
      header, nav, .toolbar, .direct-setup, .direct-actions, .save-tab-row, .split-add, .class-actions, .class-head .btn, .class-edit-icon, .roster-footer, .delete-col { display:none!important; }
      .app { box-shadow:none; }
      main { padding:0; }
      .panel { display:none!important; }
      .panel.active { display:block!important; }
      .class-card { break-inside:avoid; }
      .class-name-button { min-height:0; margin:0; padding:0; background:transparent; }
      .roster-value { min-height:0; margin:0; padding:0; border:0; background:transparent; }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>제비뽑기</h1>
    <button class="install" id="installBtn" type="button">앱 설치</button>
  </header>
  <nav id="tabs" aria-label="탭 선택">
    <span id="sortableTabsNav"></span>
    <button class="tab add-tab fixed-direct-tab" data-base-tab="direct" data-tab="direct" type="button">명단 바로 입력</button>
    <button class="add-tab" id="addTabBtn" type="button" aria-label="탭 추가">+</button>
  </nav>
  <main id="panels">
    <section class="panel active" id="room9">
      <div class="toolbar">
        <div class="order-box" id="classOrder">
          <label><span>7반</span> <input type="number" min="1" max="3" value="1" data-class="7" inputmode="numeric"></label>
          <label><span>8반</span> <input type="number" min="1" max="3" value="2" data-class="8" inputmode="numeric"></label>
          <label><span>9반</span> <input type="number" min="1" max="3" value="3" data-class="9" inputmode="numeric"></label>
        </div>
        <button class="btn secondary" data-action="apply-class-order" type="button">반 순서 적용</button>
        <button class="btn light" data-action="reset-room9" type="button">명단 초기화</button>
        <button class="btn" data-action="save-image" type="button">이미지 저장</button>
      </div>
      <div class="capture-area" id="room9Capture"></div>
    </section>

    <section class="panel" id="room11">
      <div class="toolbar">
        <button class="btn" data-action="shuffle-room11" type="button">전체 순서 섞기</button>
        <button class="btn light" data-action="default-room11-order" type="button">순서 기본값</button>
        <button class="btn light" data-action="reset-room11" type="button">명단 초기화</button>
        <button class="btn" data-action="save-image" type="button">이미지 저장</button>
      </div>
      <div class="capture-area" id="room11Capture"></div>
    </section>

    <section class="panel custom-panel" id="direct" data-custom-id="direct"></section>
    <div id="customPanels"></div>
  </main>
</div>

<dialog id="tabDialog">
  <form method="dialog" class="dialog-body" id="tabForm">
    <h2>탭 추가</h2>
    <div class="nice-upload-box">
      <h3>나이스 명단 엑셀 업로드</h3>
      <p class="nice-path">나이스 접속 → 교과담임 → 수행평가성적관리 → 조회 → 일괄업로드 → 엑셀다운로드</p>
      <label class="nice-file">
        <input id="niceExcelFile" type="file" accept=".xlsx,.xls">
        <span class="btn">엑셀 파일 선택</span>
      </label>
      <p class="nice-status" id="niceUploadStatus" role="status"></p>
    </div>
    <div class="dialog-divider">직접 탭 만들기</div>
    <label>탭 이름<input id="newTabName" maxlength="20" required autocomplete="off"></label>
    <div class="type-choice" role="group" aria-label="탭 유형">
      <label><input type="radio" name="tabType" value="combined" checked>합반</label>
      <label><input type="radio" name="tabType" value="split">분반</label>
    </div>

<script src="Sortable.min.js?v=1"></script>
<script>
const DEFAULT9 = [

const STORE_KEY = 'speaking-draw-v4';
const baseTabNames = {room9:'강의실 9',room11:'강의실 11'};
const makePeople = list => { let n=0; return list.map(s => ({ classNo:s[0], studentNo:s[1], name:s[2], excluded:Boolean(s[3]), order:s[3]?null:++n })); };

const freshState = () => ({ room9:makeRoom9(), room11:makePeople(DEFAULT11), classOrder:['7','8','9'], customTabs:[{id:'direct',name:'명단 바로 입력',type:'combined',people:blankPeople(10)}], tabOrder:['room9','room11'], hiddenTabs:[], active:'room9' });
let state = freshState();
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY));

} catch (_) {}
if(!Array.isArray(state.hiddenTabs)) state.hiddenTabs=[];

['7','8','9'].forEach(classNo=>resequenceOrders(state.room9.filter(p=>p.classNo===classNo)));

function saveState() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
const libraryLoads=new Map();
function loadLibrary(url,errorMessage) {
  if(!libraryLoads.has(url)){
    libraryLoads.set(url,new Promise((resolve,reject)=>{
      const script=document.createElement('script');
      script.src=url;
      script.onload=resolve;
      script.onerror=()=>{
        libraryLoads.delete(url);
        script.remove();
        reject(new Error(errorMessage));

      document.head.append(script);
    }));

}
function randomInt(max) {
  if (globalThis.crypto?.getRandomValues) {
    const range=0x100000000, limit=range-(range%max), a=new Uint32Array(1);

    return a[0] % max;
  }

}
function shuffledNumbers(count) {

  for(let i=out.length-1;i>0;i--){ const j=randomInt(i+1); [out[i],out[j]]=[out[j],out[i]]; }
  return out;
}
function assignRandomOrders(people) {
  const active=people.filter(p=>!p.excluded), nums=shuffledNumbers(active.length);
  people.forEach(p=>{if(p.excluded)p.order=null;});
  active.forEach((p,i)=>p.order=nums[i]);
}
function resequenceOrders(people) {
  const active=people.filter(p=>!p.excluded).sort((a,b)=>(Number(a.order)||9999)-(Number(b.order)||9999));
  people.forEach(p=>{if(p.excluded)p.order=null;});
  active.forEach((p,i)=>p.order=i+1);
}
function assignDefaultOrders(people) {

  for(const person of people) person.order=person.excluded?null:++order;
}
function escapeHtml(v) { return String(v ?? '').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c])); }

}

}

function replaceRosterField(input,person,field,index,focus=false) {

  input.closest('tr').querySelector('.row-delete').setAttribute('aria-label',`${name} 삭제`);

}
function editRosterField(button) {

  input.setAttribute('aria-label',field==='studentNo'?'학번 수정':'이름 수정');

      setRosterField(person,field,input.value,roster);
      saveState();

function niceTabName(fileName) {
  const tail=fileName.match(/_([^_]+)\.(xlsx|xls)$/i);
  if(tail) return tail[1].trim();
  return fileName.replace(/\.(xlsx|xls)$/i,'').replace(/^수행평가\s*파일일괄등록\s*-\s*/,'').slice(0,20);
}
function niceGrade(fileName) {
  const match=fileName.match(/[12]학기\s*([1-3])(?:\s|_)/);
  return match?match[1]:'';
}
function normalizeHeader(value) { return String(value??'').replace(/\s/g,''); }
async function importNiceExcel(file) {
  const status=document.querySelector('#niceUploadStatus');
  status.textContent='명단을 확인하고 있습니다.';
  try {
    await loadLibrary('xlsx.full.min.js?v=1','엑셀 인식 파일을 불러오지 못했습니다.');
    const workbook=XLSX.read(await file.arrayBuffer(),{type:'array'});
    let data=null;
    for(const sheetName of workbook.SheetNames){
      const rows=XLSX.utils.sheet_to_json(workbook.Sheets[sheetName],{header:1,raw:false,defval:''});
      const headerIndex=rows.findIndex(row=>{
        const headers=row.map(normalizeHeader);
        return headers.includes('반')&&headers.includes('번호')&&(headers.includes('성명')||headers.includes('이름'));
      });
      if(headerIndex<0) continue;
      const headers=rows[headerIndex].map(normalizeHeader), classCol=headers.indexOf('반'), numberCol=headers.indexOf('번호'), nameCol=headers.includes('성명')?headers.indexOf('성명'):headers.indexOf('이름');
      data=rows.slice(headerIndex+1).map(row=>({classNo:String(row[classCol]??'').trim(),number:String(row[numberCol]??'').trim(),name:String(row[nameCol]??'').trim()})).filter(p=>p.classNo&&p.number&&p.name);
      if(data.length) break;
    }
    if(!data?.length) throw new Error('반, 번호, 성명 열을 찾지 못했습니다.');
    let grade=niceGrade(file.name);
    if(!grade){ grade=prompt('학년을 입력하세요.','2')?.trim()||''; }
    if(!/^[1-3]$/.test(grade)) throw new Error('파일 이름에서 학년을 확인할 수 없습니다.');
    const seen=new Set();
    const people=data.map((p,i)=>{
      const classNo=String(Number(p.classNo)), number=String(Number(p.number));
      const studentNo=grade+classNo.padStart(2,'0')+number.padStart(2,'0');
      return {classNo,studentNo,name:p.name,excluded:false,order:i+1};
    }).filter(p=>{ if(seen.has(p.studentNo)) return false; seen.add(p.studentNo); return true; });
    const classNos=[...new Set(people.map(p=>p.classNo))].sort((a,b)=>Number(a)-Number(b));
    const id='custom-'+Date.now(), name=niceTabName(file.name);
    if(classNos.length>1){
      const classes=classNos.map((classNo,classIndex)=>({id:`class-${Date.now()}-${classIndex}`,classNo,people:people.filter(p=>p.classNo===classNo).map((p,i)=>({...p,order:i+1}))}));
      state.customTabs.push({id,name,type:'split',classes});
    } else {
      state.customTabs.push({id,name,type:'combined',people:people.map((p,i)=>({...p,order:i+1}))});
    }
    state.tabOrder.push(id); state.active=id; saveState(); status.textContent=`${people.length}명을 불러왔습니다.`; tabDialog.close(); renderCustomTabs();
  } catch(error) {
    status.textContent=error.message||'엑셀 파일을 인식하지 못했습니다.';
  }
}

function getImagePages(area, mobile) {
  const bounds = area.getBoundingClientRect();
  const width = Math.ceil(Math.max(bounds.width, ...Array.from(area.querySelectorAll('.table-wrap'), wrap =>
    wrap.getBoundingClientRect().left - bounds.left + wrap.scrollWidth)));
  const height = Math.ceil(bounds.height);
  const maxSide = mobile ? 4096 : 16384;
  const maxPixels = mobile ? 8_000_000 : 16_000_000;
  const fitScale = Math.min(maxSide / height, Math.sqrt(maxPixels / (width * height)));
  const scale = Math.min(2, maxSide / width, Math.max(1.25, fitScale));
  const pageHeight = Math.floor(Math.min(maxSide / scale, maxPixels / (width * scale * scale)));
  const rowEnds = Array.from(area.querySelectorAll('tbody tr'), row =>
    Math.ceil(row.getBoundingClientRect().bottom - bounds.top));
  const pages = [];
  let top = 0;
  while (top < height) {
    const limit = Math.min(height, top + pageHeight);
    const rowEnd = limit < height ? rowEnds.filter(end => end > top && end <= limit).pop() : height;
    const end = rowEnd ?? limit;
    pages.push({ top, height: end - top });
    top = end;
  }
  return { width, scale, pages, windowWidth: window.innerWidth, windowHeight: window.innerHeight };
}

async function renderImagePage(area, page, { width, scale, windowWidth, windowHeight }) {
  const canvas = await html2canvas(area, {
    backgroundColor: '#ffffff',
    logging: false,
    width,
    windowWidth,
    windowHeight,
    height: page.height,
    y: page.top,
    scale,
    onclone(_document, clone) {
      clone.querySelectorAll('.table-wrap').forEach(wrap => {
        if (wrap.scrollWidth <= wrap.clientWidth) return;
        wrap.style.overflow = 'visible';
        wrap.closest('.class-card').style.overflow = 'visible';
      });
    }
  });
  try {
    return await new Promise((resolve, reject) => {
      canvas.toBlob(blob => {
        if (blob) resolve(blob);
        else reject(new Error('PNG를 만들 수 없습니다.'));
      }, 'image/png');
    });
  } finally {
    canvas.width = 1;
    canvas.height = 1;
  }
}

  if (!entry) return;
  imageSavePreview.src = entry.url;
  imageSaveDownload.href = entry.url;

  imageSavePreview.hidden = false;
  imageSaveDownload.hidden = false;
  imageSaveShare.hidden = !navigator.share || !navigator.canShare?.({ files: [entry.file] });
}

async function savePanelImage(panel) {
  if (imageSaveBusy || imageSaveDialog.open) return;
  const area = panel.querySelector('.capture-area');
  const name = (area.querySelector('.capture-title')?.textContent.trim() || '제비뽑기').replace(/[<>:"/\\|?*]/g, '-');
  const mobile = matchMedia('(pointer: coarse), (max-width: 680px)').matches ||
    /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const session = { files: [] };
  imageSaveSession = session;
  imageSaveBusy = true;
  imageSavePage.replaceChildren();
  imageSavePageLabel.hidden = true;
  imageSavePreview.hidden = true;
  imageSaveDownload.hidden = true;
  imageSaveShare.hidden = true;
  imageSaveStatus.textContent = '이미지 만드는 중…';
  imageSaveDialog.showModal();
  try {
    await loadLibrary('html2canvas.min.js?v=1','이미지 저장 기능을 불러오지 못했습니다.');
    if (typeof html2canvas !== 'function') throw new Error('이미지 저장 기능을 불러오지 못했습니다.');
    const layout = getImagePages(area, mobile);
    const { pages } = layout;
    const date = new Date().toISOString().slice(0, 10);
    for (const [index, page] of pages.entries()) {
      if (pages.length > 1) imageSaveStatus.textContent = `이미지 만드는 중… ${index + 1}/${pages.length}`;
      const blob = await renderImagePage(area, page, layout);
      if (!imageSaveDialog.open || imageSaveSession !== session) return;
      const suffix = pages.length > 1 ? `-${index + 1}` : '';
      const file = new File([blob], `${name}-${date}${suffix}.png`, { type: 'image/png' });
      session.files.push({ file, url: URL.createObjectURL(blob) });
      imageSavePage.add(new Option(`${index + 1} / ${pages.length}`, String(index)));
    }
    if (!mobile && pages.length === 1) {
      const entry = session.files[0];
      const download = document.createElement('a');
      const url = URL.createObjectURL(entry.file);
      download.href = url;
      download.download = entry.file.name;
      document.body.append(download);
      download.click();
      download.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60_000);
      imageSaveDialog.close();
      return;
    }
    imageSavePageLabel.hidden = pages.length === 1;
    imageSaveStatus.textContent = mobile
      ? '이미지를 길게 눌러 사진에 저장할 수 있습니다.'
      : '페이지를 선택해 이미지를 다운로드하세요.';
    showImageSavePage();
  } catch (error) {
    if (imageSaveSession === session && imageSaveDialog.open) {
      imageSaveStatus.textContent = '이미지를 만들지 못했습니다. 창을 닫고 다시 시도하세요.';
    }
    console.error('이미지 저장 실패', error);
  } finally {
    imageSaveBusy = false;
  }
}

let installPrompt;
const installBtn=document.querySelector('#installBtn');
const isStandalone=matchMedia('(display-mode: standalone), (display-mode: window-controls-overlay)').matches||navigator.standalone===true;
const isDesktopShell=/Electron|DrawWebView2/i.test(navigator.userAgent);
if(isStandalone||isDesktopShell) installBtn.hidden=true;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installPrompt=e; installBtn.hidden=false; });
window.addEventListener('appinstalled',()=>{ installPrompt=null; installBtn.hidden=true; });
installBtn.addEventListener('click',async()=>{
  if(installPrompt){ installPrompt.prompt(); await installPrompt.userChoice; return; }
  if(/iPad|iPhone|iPod/.test(navigator.userAgent)) alert('Safari의 공유 버튼을 누른 뒤 홈 화면에 추가를 선택하세요.');
  else alert('Chrome 주소창 오른쪽의 설치 아이콘을 눌러 설치하세요.');
});
if('serviceWorker' in navigator&&location.protocol!=='file:'&&!isDesktopShell) {
  navigator.serviceWorker.register('./service-worker.js?v=18',{updateViaCache:'none'}).then(reg=>reg.update());
}
renderAll();
</script>
</body>
