<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173b5f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="제비뽑기">
  <title>제비뽑기</title>
  <link rel="manifest" href="manifest.webmanifest?v=14">
  <link rel="icon" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <style>
    :root { --ink:#12202e; --navy:#173b5f; --blue:#24689e; --line:#b9c8d5; --paper:#fff; --soft:#eaf1f6; --warm:#ffd465; --shade:#f1f5f8; --danger:#a33a3a; }
    * { box-sizing:border-box; }
    body { margin:0; background:#dfe7ed; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; font-size:18px; }
    button, input { font:inherit; }
    button { touch-action:manipulation; }
    .app { width:min(1180px,100%); min-height:100vh; min-height:100dvh; margin:0 auto; background:var(--paper); box-shadow:0 0 36px rgba(18,32,46,.13); }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:calc(25px + env(safe-area-inset-top)) calc(28px + env(safe-area-inset-right)) 21px calc(28px + env(safe-area-inset-left)); background:var(--navy); color:#fff; }
    h1 { margin:0; font-size:clamp(32px,5vw,48px); letter-spacing:-.05em; }
    .install { border:2px solid #fff; border-radius:10px; background:#fff; color:var(--navy); padding:10px 16px; font-weight:900; white-space:nowrap; cursor:pointer; }
    nav { display:flex; overflow-x:auto; border-bottom:2px solid var(--line); background:#fff; position:sticky; top:0; z-index:10; scrollbar-width:thin; }
    .tab { flex:0 0 auto; min-width:155px; border:0; border-bottom:6px solid transparent; background:#fff; padding:17px 16px 13px; color:#4b5b68; font-size:20px; font-weight:900; cursor:pointer; }
    .tab.active { color:var(--navy); background:#eef5fa; border-bottom-color:var(--warm); }
    .custom-tab-item { position:relative; display:flex; flex:0 0 auto; align-items:center; background:#fff; }
    .custom-tab-item .tab { padding-right:48px; }
    #sortableTabsNav { display:contents; }
    #sortableTabsNav .tab { cursor:grab; }
    #sortableTabsNav .tab:active { cursor:grabbing; }
    .tab-drag-ghost { opacity:.35; }
    .tab-drag-chosen { box-shadow:0 5px 16px rgba(18,32,46,.24); z-index:12; }
    #sortableTabsNav { display:contents; }
    .tab-drag-ghost { opacity:.35; background:#d6e5f0; }
    .tab-drag-chosen { box-shadow:inset 0 -5px 0 var(--warm); }
    .tab-close { position:absolute; right:10px; top:50%; transform:translateY(-54%); display:grid; place-items:center; width:28px; height:28px; padding:0; border:0; border-radius:50%; background:#a93c3c; color:#fff; font-size:20px; line-height:1; font-weight:1000; cursor:pointer; box-shadow:0 2px 0 rgba(0,0,0,.2); }
    .tab-close:hover { background:#842a2a; }
    .tab-close:active { transform:translateY(-48%); box-shadow:none; }
    .add-tab { flex:0 0 auto; border:0; border-left:1px solid var(--line); background:var(--navy); color:#fff; padding:14px 19px; font-size:19px; font-weight:900; cursor:pointer; }
    #addTabBtn { min-width:58px; color:var(--warm); font-size:30px; line-height:1; }
    .fixed-direct-tab { color:#fff; }
    .fixed-direct-tab.active { background:var(--blue); box-shadow:inset 0 -6px 0 var(--warm); }
    main { padding:26px max(28px,env(safe-area-inset-right)) calc(52px + env(safe-area-inset-bottom)) max(28px,env(safe-area-inset-left)); }
    .panel { display:none; }
    .panel.active { display:block; }
    .toolbar { display:flex; flex-wrap:wrap; align-items:end; gap:11px; margin-bottom:20px; }
    .order-box { display:flex; flex-wrap:wrap; gap:10px; padding:13px; background:var(--soft); border:1px solid var(--line); border-radius:11px; }
    .order-box label { display:flex; align-items:center; gap:8px; font-size:19px; font-weight:900; }
    .order-box input { width:66px; border:2px solid #8fa5b7; border-radius:8px; padding:9px; text-align:center; background:#fff; font-size:20px; font-weight:900; }
    .btn { border:0; border-radius:9px; background:var(--blue); color:#fff; padding:12px 17px; font-size:18px; font-weight:900; cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,.16); }
    .btn:active { transform:translateY(2px); box-shadow:none; }
    .btn.secondary { background:#5a6c7d; }
    .btn.light { background:#e5edf3; color:var(--navy); border:1px solid #aebdca; box-shadow:0 2px 0 #aebdca; }
    .btn.danger { background:var(--danger); }
    .class-card { margin:0 0 28px; border:2px solid var(--line); border-radius:13px; overflow:hidden; background:#fff; }
    .class-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px; background:#dce8f1; border-bottom:2px solid var(--line); }
    .class-head h2 { margin:0; font-size:27px; }
    .capture-title { margin:0 0 14px; padding:13px 16px; background:var(--navy); color:#fff; border-radius:10px; font-size:28px; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; min-width:650px; border-collapse:collapse; table-layout:fixed; }
    th, td { padding:14px 12px; border-bottom:1px solid #cbd6df; text-align:center; }
    th { background:#cbdce8; color:#18344d; font-size:20px; font-weight:900; }
    tbody tr:nth-child(even) td { background:var(--shade); }
    tbody tr:last-child td { border-bottom:0; }
    td { font-size:22px; font-weight:700; }
    td:nth-child(1), th:nth-child(1) { width:15%; }
    td:nth-child(2), th:nth-child(2) { width:25%; }
    td:nth-child(3), th:nth-child(3) { width:34%; }
    td:nth-child(4), th:nth-child(4) { width:26%; }
    td.order-cell, tbody tr:nth-child(even) td.order-cell { background:#fff0b8; }
    th.order-head { background:#f3bd39; color:#112a40; }
    .name-with-exclude { display:flex; align-items:center; justify-content:center; gap:14px; }
    .exclude-label { display:inline-flex; align-items:center; gap:5px; padding:5px 8px; border:1px solid #b7c3cd; border-radius:7px; background:#fff; color:#7d2d2d; font-size:15px; font-weight:900; white-space:nowrap; cursor:pointer; }
    .exclude-label input { width:21px; height:21px; margin:0; accent-color:#b33b3b; }
    .excluded-row td, tbody tr:nth-child(even).excluded-row td { background:#e4e7e9; color:#7a8289; }
    .excluded-row td:not(.order-cell) { text-decoration:line-through; }
    .excluded-row .exclude-label, .excluded-row input { text-decoration:none; }
    .excluded-row td.order-cell { background:#d9dddf; }
    .rank { display:inline-grid; place-items:center; min-width:64px; height:54px; padding:0 13px; border-radius:27px; background:var(--navy); color:#fff; font-size:30px; line-height:1; font-weight:1000; box-shadow:0 3px 0 rgba(0,0,0,.18); }
    .rank.top { background:#b4372e; }
    .rank.empty { background:#9aa8b4; }
    .direct-setup { display:flex; flex-wrap:wrap; align-items:end; gap:11px; margin-bottom:20px; }
    .direct-setup label { display:grid; gap:7px; font-size:19px; font-weight:900; }
    .direct-setup input { width:135px; border:2px solid #8fa5b7; border-radius:8px; padding:10px; font-size:20px; font-weight:800; }
    .direct-actions { display:flex; flex-wrap:wrap; gap:11px; margin:-8px 0 20px; }
    .save-tab-row { display:flex; margin:-8px 0 20px; padding:13px; border:2px solid #9eb3c3; border-radius:11px; background:#eef4f8; }
    .save-tab-row .btn { min-width:180px; background:var(--navy); }
    .add-rows-btn { background:#7a8894; opacity:.62; transition:background-color .2s ease,opacity .2s ease,transform .2s ease,box-shadow .2s ease; }
    .add-rows-btn:disabled { cursor:default; box-shadow:none; }
    .add-rows-btn.is-ready { background:#d36d22; opacity:1; animation:addReady .72s ease-in-out infinite alternate; }
    @keyframes addReady { from { transform:translateY(0); box-shadow:0 3px 0 rgba(0,0,0,.16),0 0 0 0 rgba(211,109,34,.22); } to { transform:translateY(-2px); box-shadow:0 5px 0 rgba(0,0,0,.16),0 0 0 7px rgba(211,109,34,.14); } }
    .entry { width:100%; border:2px solid #b8c6d1; border-radius:7px; padding:10px 8px; text-align:center; background:#fff; font-size:20px; font-weight:750; }
    .entry:focus { outline:3px solid #6ba3ce; border-color:#6ba3ce; }
    dialog { width:min(470px,calc(100% - 30px)); border:0; border-radius:15px; padding:0; box-shadow:0 18px 70px rgba(0,0,0,.35); }
    dialog::backdrop { background:rgba(15,30,45,.55); }
    .dialog-body { padding:24px; }
    .dialog-body h2 { margin:0 0 20px; font-size:28px; }
    .dialog-body label { display:grid; gap:7px; margin:0 0 16px; font-weight:900; }
    .dialog-body input { width:100%; border:2px solid #8fa5b7; border-radius:8px; padding:11px; font-size:20px; }
    .nice-upload-box { margin:0 0 22px; padding:17px; border:2px solid #7fa2bd; border-radius:12px; background:#e9f3fa; }
    .nice-upload-box h3 { margin:0 0 10px; color:var(--navy); font-size:22px; }
    .nice-path { margin:0 0 14px; color:#344b5d; font-size:15px; font-weight:750; line-height:1.6; }
    .nice-file { display:block!important; margin:0!important; padding:12px; border:2px dashed #7194ae; border-radius:9px; background:#fff; color:var(--navy); text-align:center; cursor:pointer; }
    .nice-file input { margin-top:8px; padding:7px; font-size:16px; }
    .nice-status { min-height:22px; margin:10px 0 0; color:#24567c; font-size:15px; font-weight:850; }
    .dialog-divider { display:flex; align-items:center; gap:10px; margin:0 0 18px; color:#687986; font-size:15px; font-weight:900; }
    .dialog-divider::before, .dialog-divider::after { content:""; flex:1; height:1px; background:#b8c5cf; }
    .type-choice { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:0 0 18px; }
    .type-choice label { display:flex; align-items:center; justify-content:center; gap:9px; margin:0; padding:14px; border:2px solid #9fb2c1; border-radius:10px; background:#edf3f7; cursor:pointer; }
    .type-choice input { width:22px; height:22px; margin:0; }
    .split-add { display:flex; flex-wrap:wrap; align-items:end; gap:10px; margin:0 0 20px; padding:14px; border:2px solid var(--line); border-radius:11px; background:var(--soft); }
    .split-add label, .class-head label { display:grid; gap:5px; font-size:17px; font-weight:900; }
    .split-add input, .class-head input { width:105px; border:2px solid #8fa5b7; border-radius:8px; padding:8px; text-align:center; background:#fff; font-size:19px; font-weight:900; }
    .class-actions { display:flex; flex-wrap:wrap; align-items:end; justify-content:flex-end; gap:8px; }
    .empty-note { padding:34px 16px; border:2px dashed #9fb2c1; border-radius:12px; background:#f5f8fa; text-align:center; font-size:22px; font-weight:900; color:#536879; }
    .dialog-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }
    @media (min-width:681px) and (max-width:900px) {
      main { padding:22px 18px 44px; }
      header { padding:22px 20px 18px; }
      .tab { min-width:145px; padding-inline:14px; }
      .class-actions .btn { padding:11px 13px; }
      th, td { padding:12px 9px; }
      td { font-size:20px; }
    }
    @media (max-width:680px) {
      body { font-size:17px; }
      header { padding:18px 15px 15px; }
      h1 { font-size:34px; }
      main { padding:18px 11px 38px; }
      .tab { min-width:135px; font-size:18px; padding:15px 12px 11px; }
      .install { padding:9px 12px; }
      .toolbar, .direct-setup, .split-add { align-items:stretch; }
      .toolbar .btn, .direct-setup .btn, .direct-actions .btn, .split-add .btn { flex:1 1 145px; }
      .save-tab-row .btn { width:100%; }
      .class-head { align-items:flex-start; flex-direction:column; padding:11px 12px; }
      .class-head h2 { font-size:24px; }
      .class-actions { width:100%; justify-content:flex-start; }
      .class-actions .btn { flex:1 1 125px; }
      .table-wrap { overflow:visible; }
      table { min-width:0; table-layout:auto; }
      thead { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
      tbody { display:block; padding:10px; }
      tbody tr { display:block; margin:0 0 12px; border:2px solid #c1ced8; border-radius:11px; overflow:hidden; background:#fff; }
      tbody tr:last-child { margin-bottom:0; }
      tbody tr:nth-child(even) td { background:#f4f7f9; }
      td, td:nth-child(1), td:nth-child(2), td:nth-child(3), td:nth-child(4) { display:grid; grid-template-columns:72px minmax(0,1fr); align-items:center; width:auto; min-height:52px; padding:9px 11px; border-bottom:1px solid #d5dde3; text-align:left; font-size:20px; }
      td:last-child { border-bottom:0; }
      td::before { color:#476072; font-size:15px; font-weight:900; }
      td:nth-child(1)::before { content:"반"; }
      td:nth-child(2)::before { content:"학번"; }
      td:nth-child(3)::before { content:"이름"; }
      td:nth-child(4)::before { content:"순서"; }
      td.order-cell, tbody tr:nth-child(even) td.order-cell { background:#fff0b8; }
      .name-with-exclude { justify-content:flex-start; min-width:0; }
      .name-with-exclude .entry { min-width:0; }
      .rank { justify-self:start; }
      dialog { max-height:92vh; overflow-y:auto; }
    }
    @media (max-width:420px) {
      header { flex-wrap:wrap; padding:calc(15px + env(safe-area-inset-top)) 12px 13px; }
      h1 { font-size:30px; }
      .install { margin-left:auto; font-size:15px; }
      .tab { min-width:122px; font-size:16px; }
      .add-tab { padding-inline:14px; font-size:16px; }
      td, td:nth-child(1), td:nth-child(2), td:nth-child(3), td:nth-child(4) { grid-template-columns:62px minmax(0,1fr); padding-inline:9px; font-size:19px; }
      .name-with-exclude { align-items:flex-start; flex-direction:column; gap:7px; }
      .exclude-label { font-size:14px; }
      .dialog-body { padding:18px 15px; }
    }
    @media print { header, nav, .toolbar, .direct-setup, .class-head .btn { display:none!important; } .app { box-shadow:none; } main { padding:0; } .panel { display:none!important; } .panel.active { display:block!important; } .class-card { break-inside:avoid; } }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>제비뽑기</h1>
    <button class="install" id="installBtn" type="button">앱 설치</button>
  </header>
  <nav id="tabs" aria-label="탭 선택">
    <span id="sortableTabsNav"></span>
    <button class="tab add-tab fixed-direct-tab" data-base-tab="direct" data-tab="direct" type="button">명단 바로 입력</button>
    <button class="add-tab" id="addTabBtn" type="button" aria-label="탭 추가">+</button>
  </nav>
  <main id="panels">
    <section class="panel active" id="room9">
      <div class="toolbar">
        <div class="order-box" id="classOrder">
          <label>7반 <input type="number" min="1" max="3" value="1" data-class="7" inputmode="numeric"></label>
          <label>8반 <input type="number" min="1" max="3" value="2" data-class="8" inputmode="numeric"></label>
          <label>9반 <input type="number" min="1" max="3" value="3" data-class="9" inputmode="numeric"></label>
        </div>
        <button class="btn secondary" data-action="apply-class-order" type="button">반 순서 적용</button>
        <button class="btn light" data-action="reset-room9" type="button">명단 초기화</button>
        <button class="btn" data-action="save-image" type="button">이미지 저장</button>
      </div>
      <div class="capture-area" id="room9Capture"></div>
    </section>

    <section class="panel" id="room11">
      <div class="toolbar">
        <button class="btn" data-action="shuffle-room11" type="button">전체 순서 섞기</button>
        <button class="btn light" data-action="reset-room11" type="button">명단 초기화</button>
        <button class="btn" data-action="save-image" type="button">이미지 저장</button>
      </div>
      <div class="capture-area" id="room11Capture"></div>
    </section>

    <section class="panel custom-panel" id="direct" data-custom-id="direct"></section>
    <div id="customPanels"></div>
  </main>
</div>

<dialog id="tabDialog">
  <form method="dialog" class="dialog-body" id="tabForm">
    <h2>탭 추가</h2>
    <div class="nice-upload-box">
      <h3>나이스 명단 엑셀 업로드</h3>
      <p class="nice-path">나이스 접속 → 교과담임 → 수행평가성적관리 → 조회 → 일괄업로드 → 엑셀다운로드</p>
      <label class="nice-file">엑셀 파일 선택<input id="niceExcelFile" type="file" accept=".xlsx,.xls"></label>
      <p class="nice-status" id="niceUploadStatus"></p>
    </div>
    <div class="dialog-divider">직접 탭 만들기</div>
    <label>탭 이름<input id="newTabName" maxlength="20" required autocomplete="off"></label>
    <div class="type-choice" role="group" aria-label="탭 유형">
      <label><input type="radio" name="tabType" value="combined" checked>합반</label>
      <label><input type="radio" name="tabType" value="split">분반</label>
    </div>
    <label id="newTabCountLabel">전체 인원 수<input id="newTabCount" type="number" min="1" max="200" value="10" inputmode="numeric"></label>
    <div class="dialog-actions">
      <button class="btn light" value="cancel" type="button" id="cancelTab">취소</button>
      <button class="btn" value="default" type="submit">추가</button>
    </div>
  </form>
</dialog>

<script src="Sortable.min.js?v=1"></script>
<script src="xlsx.full.min.js?v=1"></script>
<script src="html2canvas.min.js?v=1"></script>
<script>
const DEFAULT9 = [
  ['7','20725','한태민'],['7','20726','홍제성'],['7','20727','홍준서'],['7','20728','황수현'],['7','20729','황유찬'],['7','20730','황인성'],
  ['8','20817','윤채환'],['8','20818','이성현'],['8','20819','이승원'],['8','20820','이승준',true],['8','20821','이하주'],['8','20823','임국중'],['8','20824','임종민'],['8','20831','권혁규'],['8','20832','김래현'],
  ['9','20923','조민수'],['9','20924','조세현'],['9','20925','최동연'],['9','20926','허석민'],['9','20927','현준'],['9','20928','황인우'],['9','20929','김하준']
];
const DEFAULT11 = [
  ['11','21101','김동주'],['11','21102','김민규'],['11','21104','김진우',true],['11','21105','김찬목'],['11','21106','박준우'],['11','21107','서형진'],['11','21108','신수환'],['11','21109','신정헌'],['11','21110','신정훈'],['11','21112','오도겸'],['11','21113','오정근'],['11','21114','오한새'],['11','21115','원준호'],['11','21116','이경욱'],['11','21117','이원찬'],['11','21118','이유찬'],['11','21119','이종수'],['11','21120','이준우'],['11','21121','이태영'],['11','21122','이혜성'],['11','21123','장윤서'],['11','21124','정권'],['11','21127','최은호'],['11','21128','최호영'],['11','21129','하준우'],['11','21130','한선규'],['11','21131','홍준우'],['11','21132','최민호']
];
const STORE_KEY = 'speaking-draw-v4';
const makePeople = list => { let n=0; return list.map(s => ({ classNo:s[0], studentNo:s[1], name:s[2], excluded:Boolean(s[3]), order:s[3]?null:++n })); };
const blankPeople = count => Array.from({length:count}, (_,i) => ({ classNo:'', studentNo:'', name:'', excluded:false, order:i+1 }));
function makeRoom9() {
  const counts={};
  return DEFAULT9.map(([classNo,studentNo,name,excluded=false])=>({classNo,studentNo,name,excluded,order:excluded?null:(counts[classNo]=(counts[classNo]||0)+1)}));
}
const freshState = () => ({ room9:makeRoom9(), room11:makePeople(DEFAULT11), classOrder:['7','8','9'], customTabs:[{id:'direct',name:'명단 바로 입력',type:'combined',people:blankPeople(10)}], tabOrder:['room9','room11'], hiddenTabs:[], active:'room9' });
let state = freshState();
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY));
  if (saved && Array.isArray(saved.room9) && Array.isArray(saved.room11) && Array.isArray(saved.customTabs)) state = saved;
} catch (_) {}
function mergeRoster(current, defaults) {
  const old=Array.isArray(current)?current:[];
  return defaults.map(person=>{
    const saved=old.find(p=>p.studentNo===person.studentNo);
    if(!saved) return person;
    return {...person,order:saved.order,excluded:typeof saved.excluded==='boolean'?saved.excluded:person.excluded};
  });
}
state.room9=mergeRoster(state.room9,makeRoom9());
state.room11=mergeRoster(state.room11,makePeople(DEFAULT11));

function saveState() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
function randomInt(max) {
  if (globalThis.crypto?.getRandomValues) {
    const range=0x100000000, limit=range-(range%max), a=new Uint32Array(1);
    do crypto.getRandomValues(a); while (a[0] >= limit);
    return a[0] % max;
  }
  return Math.floor(Math.random()*max);
}
function shuffledNumbers(count) {
  const out=Array.from({length:count},(_,i)=>i+1);
  for(let i=out.length-1;i>0;i--){ const j=randomInt(i+1); [out[i],out[j]]=[out[j],out[i]]; }
  return out;
}
function assignRandomOrders(people) {
  const active=people.filter(p=>!p.excluded), nums=shuffledNumbers(active.length);
  people.forEach(p=>{if(p.excluded)p.order=null;});
  active.forEach((p,i)=>p.order=nums[i]);
}
function resequenceOrders(people) {
  const active=people.filter(p=>!p.excluded).sort((a,b)=>(Number(a.order)||9999)-(Number(b.order)||9999));
  people.forEach(p=>{if(p.excluded)p.order=null;});
  active.forEach((p,i)=>p.order=i+1);
}
function escapeHtml(v) { return String(v ?? '').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c])); }
function deriveClass(no) { const s=String(no).trim(); return /^\d{5}$/.test(s) ? String(Number(s.slice(1,3))) : ''; }
function rankMarkup(order) {
  const n=Number(order);
  return n ? `<span class="rank ${n<=3?'top':''}">${n}</span>` : '<span class="rank empty">-</span>';
}
function fixedRows(people,listName) {

}

function splitPanelMarkup(tab) {

function activateTab(id, persist=true) {
  if(state.hiddenTabs.includes(id)||!document.getElementById(id)) return;
  document.querySelectorAll('.tab,.panel').forEach(el=>el.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${id}"]`)?.classList.add('active');
  document.getElementById(id)?.classList.add('active');

  if(persist) saveState();
}
function getCustom(id) { return state.customTabs.find(t=>t.id===id); }
function syncCustomPanel(panel) {
  const tab=getCustom(panel.dataset.customId); if(!tab) return;
  if(tab.type==='split'){
    panel.querySelectorAll('.split-class-card').forEach(card=>{
      const group=tab.classes.find(c=>c.id===card.dataset.classId); if(!group) return;
      card.querySelectorAll('tbody tr').forEach((tr,i)=>{
        if(group.people[i]) Object.assign(group.people[i],{classNo:group.classNo,studentNo:tr.querySelector('.split-no-entry')?.value.trim()||'',name:tr.querySelector('.split-name-entry')?.value.trim()||'',excluded:Boolean(tr.querySelector('.split-exclude')?.checked)});
      });
    });
    saveState(); return;
  }
  panel.querySelectorAll('tbody tr').forEach((tr,i)=>{
    const c=tr.querySelector('.class-entry')?.value.trim()||'';
    const no=tr.querySelector('.no-entry')?.value.trim()||'';
    const name=tr.querySelector('.name-entry')?.value.trim()||'';
    if(tab.people[i]) Object.assign(tab.people[i],{classNo:c||deriveClass(no),studentNo:no,name,excluded:Boolean(tr.querySelector('.custom-exclude')?.checked)});
  });
  saveState();
}

document.querySelector('#panels').addEventListener('click',async e=>{
  const btn=e.target.closest('[data-action]'); if(!btn) return;

  if(action==='shuffle-class'){
    const people=state.room9.filter(p=>p.classNo===btn.dataset.class); assignRandomOrders(people); saveState(); renderRoom9();
  } else if(action==='apply-class-order'){
    const entries=[...document.querySelectorAll('#classOrder input')].map(i=>({c:i.dataset.class,n:Number(i.value)}));

    if(confirm('강의실 11 명단과 순서를 처음 상태로 되돌릴까요?')){ state.room11=makePeople(DEFAULT11); saveState(); renderRoom11(); }

    const panel=btn.closest('.custom-panel'), tab=getCustom(panel.dataset.customId), input=panel.querySelector('.new-class-no');

    if(tab.classes.some(c=>c.classNo===classNo)){ alert('이미 추가된 반입니다.'); return; }
    tab.classes.push({id:'class-'+Date.now(),classNo,people:blankPeople(1).map(p=>({...p,classNo}))}); saveState(); renderCustomTabs();
  } else if(action==='split-resize'){
    const panel=btn.closest('.custom-panel'), tab=getCustom(panel.dataset.customId), card=btn.closest('.split-class-card'), group=tab.classes.find(c=>c.id===card.dataset.classId); syncCustomPanel(panel);
    const count=Math.max(1,Math.min(100,Number(card.querySelector('.split-count').value)||1));
    if(count>group.people.length) group.people.push(...blankPeople(count-group.people.length).map((p,i)=>({...p,classNo:group.classNo,order:group.people.length+i+1})));
    else group.people=group.people.slice(0,count);
    saveState(); renderCustomTabs();
  } else if(action==='split-shuffle'){
    const panel=btn.closest('.custom-panel'), tab=getCustom(panel.dataset.customId), group=tab.classes.find(c=>c.id===btn.closest('.split-class-card').dataset.classId); syncCustomPanel(panel); assignRandomOrders(group.people); saveState(); renderCustomTabs();
  } else if(action==='split-clear'){
    const panel=btn.closest('.custom-panel'), tab=getCustom(panel.dataset.customId), group=tab.classes.find(c=>c.id===btn.closest('.split-class-card').dataset.classId);
    if(confirm(`${group.classNo}반 명단과 순서를 초기화할까요?`)){ group.people=blankPeople(group.people.length).map(p=>({...p,classNo:group.classNo})); saveState(); renderCustomTabs(); }
  } else if(action==='split-delete-class'){
    const panel=btn.closest('.custom-panel'), tab=getCustom(panel.dataset.customId), group=tab.classes.find(c=>c.id===btn.closest('.split-class-card').dataset.classId);
    if(confirm(`${group.classNo}반을 삭제할까요?`)){ tab.classes=tab.classes.filter(c=>c.id!==group.id); saveState(); renderCustomTabs(); }
  } else if(action==='custom-add'){
    const panel=btn.closest('.custom-panel'), tab=getCustom(panel.dataset.customId); syncCustomPanel(panel);
    const count=Math.max(1,Math.min(200,Number(panel.querySelector('.custom-count').value)||1));
    const nextOrder=Math.max(0,...tab.people.filter(p=>!p.excluded).map(p=>Number(p.order)||0));
    tab.people.push(...blankPeople(count).map((p,i)=>({...p,order:nextOrder+i+1})));
    saveState(); renderCustomTabs();
  } else if(action==='custom-shuffle'){
    const panel=btn.closest('.custom-panel'), tab=getCustom(panel.dataset.customId); syncCustomPanel(panel); assignRandomOrders(tab.people); saveState(); renderCustomTabs();
  } else if(action==='save-direct-tab'){
    const panel=btn.closest('.custom-panel'), direct=getCustom('direct'); syncCustomPanel(panel);
    const name=prompt('저장할 탭 이름을 입력하세요.','새 명단')?.trim();

    const id='custom-'+Date.now();
    state.customTabs.push({id,name:name.slice(0,20),type:'combined',people:direct.people.map(person=>({...person}))});
    state.tabOrder.push(id); state.active=id; saveState(); renderCustomTabs();
  } else if(action==='custom-clear'){
    const panel=btn.closest('.custom-panel'), tab=getCustom(panel.dataset.customId);
    if(confirm('이 탭의 명단과 순서를 초기화할까요?')){ tab.people=blankPeople(tab.people.length); saveState(); renderCustomTabs(); }
  } else if(action==='save-image'){
    await savePanelImage(btn.closest('.panel'));
  }
});

function niceTabName(fileName) {
  const tail=fileName.match(/_([^_]+)\.(xlsx|xls)$/i);
  if(tail) return tail[1].trim();
  return fileName.replace(/\.(xlsx|xls)$/i,'').replace(/^수행평가\s*파일일괄등록\s*-\s*/,'').slice(0,20);
}
function niceGrade(fileName) {
  const match=fileName.match(/[12]학기\s*([1-3])(?:\s|_)/);
  return match?match[1]:'';
}
function normalizeHeader(value) { return String(value??'').replace(/\s/g,''); }
async function importNiceExcel(file) {
  const status=document.querySelector('#niceUploadStatus');
  if(typeof XLSX==='undefined'){ status.textContent='엑셀 인식 파일을 불러오지 못했습니다.'; return; }
  status.textContent='명단을 확인하고 있습니다.';
  try {
    const workbook=XLSX.read(await file.arrayBuffer(),{type:'array'});
    let data=null;
    for(const sheetName of workbook.SheetNames){
      const rows=XLSX.utils.sheet_to_json(workbook.Sheets[sheetName],{header:1,raw:false,defval:''});
      const headerIndex=rows.findIndex(row=>{
        const headers=row.map(normalizeHeader);
        return headers.includes('반')&&headers.includes('번호')&&(headers.includes('성명')||headers.includes('이름'));
      });
      if(headerIndex<0) continue;
      const headers=rows[headerIndex].map(normalizeHeader), classCol=headers.indexOf('반'), numberCol=headers.indexOf('번호'), nameCol=headers.includes('성명')?headers.indexOf('성명'):headers.indexOf('이름');
      data=rows.slice(headerIndex+1).map(row=>({classNo:String(row[classCol]??'').trim(),number:String(row[numberCol]??'').trim(),name:String(row[nameCol]??'').trim()})).filter(p=>p.classNo&&p.number&&p.name);
      if(data.length) break;
    }
    if(!data?.length) throw new Error('반, 번호, 성명 열을 찾지 못했습니다.');
    let grade=niceGrade(file.name);
    if(!grade){ grade=prompt('학년을 입력하세요.','2')?.trim()||''; }
    if(!/^[1-3]$/.test(grade)) throw new Error('파일 이름에서 학년을 확인할 수 없습니다.');
    const seen=new Set();
    const people=data.map((p,i)=>{
      const classNo=String(Number(p.classNo)), number=String(Number(p.number));
      const studentNo=grade+classNo.padStart(2,'0')+number.padStart(2,'0');
      return {classNo,studentNo,name:p.name,excluded:false,order:i+1};
    }).filter(p=>{ if(seen.has(p.studentNo)) return false; seen.add(p.studentNo); return true; });
    const classNos=[...new Set(people.map(p=>p.classNo))].sort((a,b)=>Number(a)-Number(b));
    const id='custom-'+Date.now(), name=niceTabName(file.name);
    if(classNos.length>1){
      const classes=classNos.map((classNo,classIndex)=>({id:`class-${Date.now()}-${classIndex}`,classNo,people:people.filter(p=>p.classNo===classNo).map((p,i)=>({...p,order:i+1}))}));
      state.customTabs.push({id,name,type:'split',classes});
    } else {
      state.customTabs.push({id,name,type:'combined',people:people.map((p,i)=>({...p,order:i+1}))});
    }
    state.tabOrder.push(id); state.active=id; saveState(); status.textContent=`${people.length}명을 불러왔습니다.`; tabDialog.close(); renderCustomTabs();
  } catch(error) {
    status.textContent=error.message||'엑셀 파일을 인식하지 못했습니다.';
  }
}
document.querySelector('#niceExcelFile').addEventListener('change',e=>{ const file=e.target.files?.[0]; if(file) importNiceExcel(file); });

async function savePanelImage(panel) {
  if(typeof html2canvas!=='function'){ alert('이미지 저장 기능을 불러오지 못했습니다. 인터넷 연결을 확인하세요.'); return; }
  const area=panel.querySelector('.capture-area'), name=panel.querySelector('.capture-title')?.textContent.trim()||'제비뽑기';
  const canvas=await html2canvas(area,{backgroundColor:'#ffffff',scale:2,useCORS:true,scrollX:0,scrollY:-window.scrollY});
  const link=document.createElement('a'), date=new Date().toISOString().slice(0,10);
  link.download=`${name}-${date}.png`; link.href=canvas.toDataURL('image/png'); link.click();
}

let installPrompt;
const installBtn=document.querySelector('#installBtn');
const isStandalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isDesktopShell=/Electron/i.test(navigator.userAgent);
if(isStandalone||isDesktopShell) installBtn.hidden=true;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installPrompt=e; installBtn.hidden=false; });
window.addEventListener('appinstalled',()=>{ installPrompt=null; installBtn.hidden=true; });
installBtn.addEventListener('click',async()=>{
  if(installPrompt){ installPrompt.prompt(); await installPrompt.userChoice; return; }
  if(/iPad|iPhone|iPod/.test(navigator.userAgent)) alert('Safari의 공유 버튼을 누른 뒤 홈 화면에 추가를 선택하세요.');
  else alert('Chrome 주소창 오른쪽의 설치 아이콘을 눌러 설치하세요.');
});
if('serviceWorker' in navigator&&location.protocol!=='file:') {
  navigator.serviceWorker.register('./service-worker.js?v=14',{updateViaCache:'none'}).then(reg=>reg.update());
}
renderAll();
</script>
