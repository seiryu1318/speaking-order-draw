<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16324f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="말하기 제비뽑기">
  <title>2학년 말하기 제비뽑기</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    :root { --ink:#17212b; --navy:#16324f; --blue:#28659c; --line:#d8dee5; --paper:#fff; --soft:#f3f6f8; --warm:#f6b94a; }
    * { box-sizing:border-box; }
    body { margin:0; background:#eef2f5; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
    button, input { font:inherit; }
    .app { width:min(1060px,100%); min-height:100vh; margin:0 auto; background:var(--paper); box-shadow:0 0 35px rgba(22,50,79,.09); }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:26px 28px 20px; background:var(--navy); color:#fff; }
    h1 { margin:0; font-size:clamp(22px,4vw,34px); letter-spacing:-.04em; }
    .install { display:none; border:1px solid rgba(255,255,255,.7); border-radius:8px; background:transparent; color:#fff; padding:9px 13px; font-weight:700; white-space:nowrap; }
    nav { display:grid; grid-template-columns:repeat(3,1fr); border-bottom:1px solid var(--line); background:#fff; position:sticky; top:0; z-index:10; }
    .tab { border:0; border-bottom:4px solid transparent; background:#fff; padding:16px 8px 13px; color:#5c6670; font-weight:800; cursor:pointer; }
    .tab.active { color:var(--navy); border-bottom-color:var(--warm); }
    main { padding:24px 28px 42px; }
    .panel { display:none; }
    .panel.active { display:block; }
    .toolbar { display:flex; flex-wrap:wrap; align-items:end; gap:10px; margin-bottom:18px; }
    .order-box { display:flex; flex-wrap:wrap; gap:8px; padding:12px; background:var(--soft); border-radius:10px; }
    .order-box label { display:flex; align-items:center; gap:7px; font-weight:800; }
    .order-box input { width:58px; border:1px solid #b9c4ce; border-radius:7px; padding:8px; text-align:center; background:#fff; }
    .btn { border:0; border-radius:8px; background:var(--blue); color:#fff; padding:10px 15px; font-weight:800; cursor:pointer; box-shadow:0 2px 0 rgba(0,0,0,.12); }
    .btn:active { transform:translateY(1px); box-shadow:none; }
    .btn.secondary { background:#5f6f7f; }
    .class-card { margin:0 0 24px; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
    .class-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; background:var(--soft); border-bottom:1px solid var(--line); }
    .class-head h2 { margin:0; font-size:19px; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; min-width:560px; border-collapse:collapse; table-layout:fixed; }
    th, td { padding:11px 12px; border-bottom:1px solid #e4e8ec; text-align:center; }
    th { background:#fafbfc; color:#43505c; font-size:14px; }
    tr:last-child td { border-bottom:0; }
    td:nth-child(1), th:nth-child(1) { width:16%; }
    td:nth-child(2), th:nth-child(2) { width:25%; }
    td:nth-child(3), th:nth-child(3) { width:35%; }
    td:nth-child(4), th:nth-child(4) { width:24%; }
    .rank { display:inline-grid; place-items:center; min-width:34px; height:30px; padding:0 9px; border-radius:15px; background:#e8f1f8; color:#164c78; font-weight:900; }
    .direct-setup { display:flex; flex-wrap:wrap; align-items:end; gap:10px; margin-bottom:16px; }
    .direct-setup label { display:grid; gap:6px; font-weight:800; }
    .direct-setup input { width:120px; border:1px solid #b9c4ce; border-radius:7px; padding:9px; }
    .entry { width:100%; border:1px solid transparent; border-radius:6px; padding:7px 8px; text-align:center; background:#f7f9fa; }
    .entry:focus { outline:2px solid #77a6cf; background:#fff; }
    @media (max-width:650px) {
      header { padding:20px 16px 16px; }
      main { padding:18px 12px 34px; }
      .tab { padding:14px 4px 11px; }
      .class-head { padding:10px 12px; }
      th, td { padding:9px 7px; }
    }
    @media print { header, nav, .toolbar, .direct-setup, .class-head .btn { display:none!important; } .app { box-shadow:none; } main { padding:0; } .panel { display:none!important; } .panel.active { display:block!important; } .class-card { break-inside:avoid; } }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>2학년 말하기 제비뽑기</h1>
    <button class="install" id="installBtn" type="button">앱 설치</button>
  </header>
  <nav aria-label="강의실 선택">
    <button class="tab active" data-tab="room9" type="button">강의실 9</button>
    <button class="tab" data-tab="room11" type="button">강의실 11</button>
    <button class="tab" data-tab="direct" type="button">직접 입력</button>
  </nav>
  <main>
    <section class="panel active" id="room9">
      <div class="toolbar">
        <div class="order-box" id="classOrder">
          <label>7반 <input type="number" min="1" max="3" value="1" data-class="7" inputmode="numeric"></label>
          <label>8반 <input type="number" min="1" max="3" value="2" data-class="8" inputmode="numeric"></label>
          <label>9반 <input type="number" min="1" max="3" value="3" data-class="9" inputmode="numeric"></label>
        </div>
        <button class="btn secondary" id="applyClassOrder" type="button">반 순서 적용</button>
      </div>
      <div id="room9Classes"></div>
    </section>

    <section class="panel" id="room11">
      <div class="toolbar">
        <button class="btn" id="shuffle11" type="button">전체 순서 섞기</button>
      </div>
      <div class="class-card">
        <div class="class-head"><h2>11반</h2></div>
        <div class="table-wrap"><table><thead><tr><th>반</th><th>학번</th><th>이름</th><th>순서</th></tr></thead><tbody id="room11Body"></tbody></table></div>
      </div>
    </section>

    <section class="panel" id="direct">
      <div class="direct-setup">
        <label>전체 인원 수<input id="directCount" type="number" min="1" max="200" value="10" inputmode="numeric"></label>
        <button class="btn secondary" id="makeRows" type="button">입력칸 만들기</button>
        <button class="btn" id="shuffleDirect" type="button">전체 순서 섞기</button>
      </div>
      <div class="class-card">
        <div class="table-wrap"><table><thead><tr><th>반</th><th>학번</th><th>이름</th><th>순서</th></tr></thead><tbody id="directBody"></tbody></table></div>
      </div>
    </section>
  </main>
</div>
<script>
const students9 = [
  ['7','20725','한태민'],['7','20726','홍제성'],['7','20727','홍준서'],['7','20728','황수현'],['7','20729','황유찬'],['7','20730','황인성'],
  ['8','20817','윤채환'],['8','20818','이성현'],['8','20819','이승원'],['8','20821','이하주'],['8','20823','임국중'],['8','20824','임종민'],['8','20831','권혁규'],['8','20832','김래현'],
  ['9','20923','조민수'],['9','20924','조세현'],['9','20925','최동연'],['9','20926','허석민'],['9','20927','현준'],['9','20928','황인우'],['9','20929','김하준']
];
const students11 = [
  ['11','21101','김동주'],['11','21102','김민규'],['11','21105','김찬목'],['11','21106','박준우'],['11','21107','서형진'],['11','21108','신수환'],['11','21109','신정헌'],['11','21110','신정훈'],['11','21112','오도겸'],['11','21113','오정근'],['11','21114','오한새'],['11','21115','원준호'],['11','21116','이경욱'],['11','21117','이원찬'],['11','21118','이유찬'],['11','21119','이종수'],['11','21120','이준우'],['11','21121','이태영'],['11','21122','이혜성'],['11','21123','장윤서'],['11','21124','정권'],['11','21126','최은호'],['11','21127','최호영'],['11','21128','최호영'],['11','21129','하준우'],['11','21130','한선규'],['11','21131','홍준우'],['11','21132','최민호']
];

const state = {
  room9: Object.fromEntries(['7','8','9'].map(c => [c, students9.filter(s => s[0] === c)])),
  room11: [...students11],
  classOrder: ['7','8','9']
};

function randomInt(max) {
  if (globalThis.crypto?.getRandomValues) {
    const range = 0x100000000;
    const limit = range - (range % max);
    const a = new Uint32Array(1);
    do crypto.getRandomValues(a); while (a[0] >= limit);
    return a[0] % max;
  }
  return Math.floor(Math.random() * max);
}
function shuffle(list) {
  const out = [...list];
  for (let i = out.length - 1; i > 0; i--) {
    const j = randomInt(i + 1);
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}
function rows(list) {
  return list.map((s,i) => `<tr><td>${s[0]}</td><td>${s[1]}</td><td>${s[2]}</td><td><span class="rank">${i+1}</span></td></tr>`).join('');
}
function render9() {
  const root = document.querySelector('#room9Classes');
  root.innerHTML = state.classOrder.map(c => `
    <article class="class-card" data-card="${c}">
      <div class="class-head"><h2>${c}반</h2><button class="btn" type="button" data-shuffle="${c}">${c}반 순서 섞기</button></div>
      <div class="table-wrap"><table><thead><tr><th>반</th><th>학번</th><th>이름</th><th>순서</th></tr></thead><tbody>${rows(state.room9[c])}</tbody></table></div>
    </article>`).join('');
}
function render11() { document.querySelector('#room11Body').innerHTML = rows(state.room11); }

document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.tab,.panel').forEach(el => el.classList.remove('active'));
  btn.classList.add('active');
  document.querySelector('#' + btn.dataset.tab).classList.add('active');
}));
document.querySelector('#room9Classes').addEventListener('click', e => {
  const c = e.target.dataset.shuffle;
  if (!c) return;
  state.room9[c] = shuffle(state.room9[c]);
  render9();
});
document.querySelector('#applyClassOrder').addEventListener('click', () => {
  const entries = [...document.querySelectorAll('#classOrder input')].map(i => ({ c:i.dataset.class, n:Number(i.value) }));
  const nums = entries.map(x => x.n);
  if (nums.some(n => !Number.isInteger(n) || n < 1 || n > 3) || new Set(nums).size !== 3) {
    alert('반 순서는 1, 2, 3을 한 번씩 입력하세요.'); return;
  }
  state.classOrder = entries.sort((a,b) => a.n-b.n).map(x => x.c);
  render9();
});
document.querySelector('#shuffle11').addEventListener('click', () => { state.room11 = shuffle(state.room11); render11(); });

function deriveClass(no) {
  const s = String(no).trim();
  if (/^\d{5}$/.test(s)) return String(Number(s.slice(1,3)));
  return '';
}
function makeDirectRows(keep=true) {
  const body = document.querySelector('#directBody');
  const old = keep ? [...body.querySelectorAll('tr')].map(tr => [...tr.querySelectorAll('input')].map(i => i.value)) : [];
  const count = Math.max(1, Math.min(200, Number(document.querySelector('#directCount').value) || 1));
  document.querySelector('#directCount').value = count;
  body.innerHTML = Array.from({length:count}, (_,i) => {
    const v = old[i] || ['','',''];
    return `<tr><td><input class="entry class-entry" value="${escapeHtml(v[0])}" aria-label="${i+1}번 반"></td><td><input class="entry no-entry" value="${escapeHtml(v[1])}" inputmode="numeric" aria-label="${i+1}번 학번"></td><td><input class="entry name-entry" value="${escapeHtml(v[2])}" aria-label="${i+1}번 이름"></td><td><span class="rank">${i+1}</span></td></tr>`;
  }).join('');
}
function escapeHtml(v) { return String(v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
document.querySelector('#makeRows').addEventListener('click', () => makeDirectRows(true));
document.querySelector('#directBody').addEventListener('input', e => {
  if (!e.target.classList.contains('no-entry')) return;
  const classInput = e.target.closest('tr').querySelector('.class-entry');
  if (!classInput.value.trim()) classInput.value = deriveClass(e.target.value);
});
document.querySelector('#shuffleDirect').addEventListener('click', () => {
  const body = document.querySelector('#directBody');
  const data = [...body.querySelectorAll('tr')].map(tr => {
    const inputs = [...tr.querySelectorAll('input')];
    return [inputs[0].value.trim() || deriveClass(inputs[1].value), inputs[1].value.trim(), inputs[2].value.trim()];
  }).filter(s => s[1] || s[2]);
  if (!data.length) { alert('학번과 이름을 입력하세요.'); return; }
  body.innerHTML = shuffle(data).map((s,i) => `<tr><td><input class="entry class-entry" value="${escapeHtml(s[0])}"></td><td><input class="entry no-entry" value="${escapeHtml(s[1])}" inputmode="numeric"></td><td><input class="entry name-entry" value="${escapeHtml(s[2])}"></td><td><span class="rank">${i+1}</span></td></tr>`).join('');
  document.querySelector('#directCount').value = data.length;
});

let installPrompt;
const installBtn = document.querySelector('#installBtn');
installBtn.style.display = 'block';
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });
installBtn.addEventListener('click', async () => {
  if (installPrompt) { installPrompt.prompt(); await installPrompt.userChoice; installPrompt = null; return; }
  alert('Safari의 공유 버튼을 누른 뒤 홈 화면에 추가를 선택하세요.');
});
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('./service-worker.js');
render9(); render11(); makeDirectRows(false);
</script>
</body>
</html>
